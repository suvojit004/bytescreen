# Public entry point: static assets here, EJS pages and APIs in Express.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;

    # Filenames are not fingerprinted, so use a short browser cache lifetime.
    location ~ ^/(css|js|images|videos)/ {
        try_files $uri =404;
        expires 1h;
    }

    # /resources and its category pages belong to Express, not this server.
    location ~ ^/resources/.+\.pdf$ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        # Traefik terminates TLS and supplies the original client and scheme.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header Connection "";
    }
}
