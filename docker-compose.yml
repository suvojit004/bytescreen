services:
  backend:
    build:
      context: .
    container_name: bytescreen-backend

    ports:
      - "3000:3000"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8

    container_name: bytescreen-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: