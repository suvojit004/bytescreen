services:
  nginx:
    image: nginx:stable-alpine
    container_name: bytescreen-nginx
    restart: unless-stopped

    # Visit http://localhost:8080. Set HTTP_PORT to use another host port.
    ports:
      - "${HTTP_PORT:-8080}:80"

    volumes:
      - ./src/public:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - backend

  backend:
    build:
      context: .
    container_name: bytescreen-backend

    expose:
      - "3000"

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      BEHIND_NGINX: "true"

    restart: unless-stopped

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8

    container_name: bytescreen-mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
